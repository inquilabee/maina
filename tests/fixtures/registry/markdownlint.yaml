name: markdownlint
cli: markdownlint
version: 0.34.0
install:
  backend: npm
  package: markdownlint-cli
args:
  path:
    positional: true
    repeat: true
    type: path
    required: true
  fix:
    flag: --fix
    type: flag
  config:
    flag: --config
    type: path
output:
  format: text
  success_codes: [0]
parser: text
