[project]
name = "maina"
version = "0.1.0"
description = "Use non-Python CLIs from Python with native-like APIs"
readme = "README.md"
authors = [
    { name = "Vishal Mishra", email = "vishal.k.mishra2@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.32",
    "typer>=0.12",
]

[project.scripts]
maina = "maina.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "shipgate>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "maina"
module-root = "src"

[tool.deptry]
# First-party packages (not reported as missing third-party deps).
known_first_party = ["maina"]

# [tool.deptry.per_rule_ignores]
# DEP002 = ["optional-extra-package"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits network, mise, npm, or other external services",
]
