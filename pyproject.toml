[project]
name = "maina"
version = "0.1.1"
description = "Use non-Python CLIs from Python with native-like APIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vishal Mishra", email = "vishal.k.mishra2@gmail.com" }
]
keywords = ["cli", "subprocess", "tools", "registry", "wrapper", "mise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.11.4"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.32",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://inquilabee.github.io/maina/"
Documentation = "https://inquilabee.github.io/maina/"
Repository = "https://github.com/inquilabee/maina"
Changelog = "https://github.com/inquilabee/maina/blob/main/CHANGELOG.md"
Issues = "https://github.com/inquilabee/maina/issues"

[project.scripts]
maina = "maina.cli:main"

[dependency-groups]
dev = [
    "mkdocs-material>=9.5",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.9",
    "shipgate>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "maina"
module-root = "src"

[tool.deptry]
# First-party packages (not reported as missing third-party deps).
known_first_party = ["maina"]

# [tool.deptry.per_rule_ignores]
# DEP002 = ["optional-extra-package"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# Docs code blocks keep their hand-aligned comments.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hermetic by default; run the network/mise/npm suite with: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: hits network, mise, npm, or other external services",
]
