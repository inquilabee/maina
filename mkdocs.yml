site_name: maina
site_description: Call non-Python CLIs from Python with native-like APIs
site_url: https://inquilabee.github.io/maina/
repo_url: https://github.com/inquilabee/maina
docs_dir: docs
exclude_docs: |
  plans/
  reviews/
  product/
theme:
  name: material
  logo: images/maina-mark.svg
  favicon: images/maina-mark.svg
  palette:
    - scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
nav:
  - Home: index.md
  - Quickstart: user/quickstart.md
  - CLI: user/cli.md
  - Manifest schema: user/manifests.md
  - Install backends: user/backends.md
  - Parsers: user/parsers.md
  - Errors: user/errors.md
  - Extending maina: user/extending.md
  - Security model: user/security.md
  - Architecture: architecture.md
