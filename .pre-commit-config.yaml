# Contributor hooks. Maintainer-local ShipGate hooks live in the (gitignored)
# .pre-commit-config.shipgate.yaml: pre-commit install -c .pre-commit-config.shipgate.yaml
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pytest-unit
        name: pytest unit tests
        entry: uv run pytest tests/unit -q
        language: system
        pass_filenames: false
        always_run: true
