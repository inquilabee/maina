# ShipGate hooks aligned with upstream dogfood:
# https://github.com/inquilabee/shipgate/blob/main/.pre-commit-config.yaml
# Uses this repo's shipgate.yaml suite (full).
# src-layout needs shipgate-link-src.sh.
repos:
  - repo: local
    hooks:
      - id: shipgate-sync
        name: uv sync dev dependencies
        entry: uv sync --group dev
        language: system
        pass_filenames: false
        always_run: true
      - id: shipgate-install
        name: shipgate install
        entry: bash -c 'uv run shipgate install && bash scripts/shipgate-link-src.sh'
        language: system
        pass_filenames: false
        always_run: true
      - id: shipgate-format
        name: shipgate format
        entry: uv run shipgate format --target .
        language: system
        pass_filenames: false
        always_run: true
      - id: shipgate-check
        name: shipgate check (full suite)
        entry: uv run shipgate check --target .
        language: system
        pass_filenames: false
        always_run: true
      - id: shipgate-refactor
        name: shipgate refactor check --strict
        entry: uv run shipgate refactor check --strict src
        language: system
        files: ^(src|tests)/.*\.py$
        pass_filenames: false
        always_run: true
      - id: pytest-unit
        name: pytest unit tests
        entry: uv run pytest tests/unit -q
        language: system
        pass_filenames: false
        always_run: true
