# GitHub .tar.xz asset: the binary is found inside the extracted tree.
cli: shellcheck
version: 0.10.0
install:
  backend: github
  repo: koalaman/shellcheck
  tag: v0.10.0
  binary: shellcheck
  assets:
    linux-x86_64: shellcheck-v0.10.0.linux.x86_64.tar.xz
    macos-arm64: shellcheck-v0.10.0.darwin.aarch64.tar.xz
  sha256:
    linux-x86_64: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
    macos-arm64: bbd2f14826328eee7679da7221f2bc3afb011f6a928b848c80c321f6046ddf81
parser: json
args:
  path: {positional: true, required: true, repeat: true, type: path}
  # force machine output by default; pass format=tty to override
  format: {flag: -f, default: json}
  shell: {flag: -s}
output:
  # 1 = findings; still a successful run
  success_codes: [0, 1]
