# GitHub release-asset install: one binary per platform.
# install.sha256 pins each asset's digest (platform -> 64 hex): a mismatch aborts
# before chmod +x. Pin digests for every bare-binary asset; without them, anything
# the server returns that looks like an executable is installed.
cli: jq
version: 1.7.1
platforms: [linux, macos]
install:
  backend: github
  repo: jqlang/jq
  tag: jq-1.7.1
  binary: jq
  assets:
    linux-x86_64: jq-linux-amd64
    linux-arm64: jq-linux-arm64
    macos-x86_64: jq-macos-amd64
    macos-arm64: jq-macos-arm64
  sha256: # from the release's sha256sum.txt
    linux-x86_64: 5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
    linux-arm64: 4dd2d8a0661df0b22f1bb9a1f9830f06b6f3b8f7d91211a1ef5d7c4f06a8b4a5
    macos-x86_64: 4155822bbf5ea90f5c79cf254665975eb4274d426d0709770c21774de5407443
    macos-arm64: 0bbe619e663e0de2c550be2fe0d240d076799d6f8a652b70fa04aea8a8362e8a
parser: json
args:
  # jq '<filter>' [file.json]
  filter: {positional: true, required: true}
  path: {positional: true, type: path}
  raw: {flag: -r, type: flag}
  compact: {flag: -c, type: flag}
output:
  success_codes: [0]
