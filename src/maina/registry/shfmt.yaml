name: shfmt
cli: shfmt
version: 3.10.0
platforms: [linux, macos]
# Bare binary asset (no archive): `shfmt_v{version}_{os}_{arch}` (arch x86_64 -> amd64).
install:
  backend: github
  repo: mvdan/sh
  tag: v3.10.0
  binary: shfmt
  assets:
    linux-x86_64: shfmt_v3.10.0_linux_amd64
    linux-arm64: shfmt_v3.10.0_linux_arm64
    macos-x86_64: shfmt_v3.10.0_darwin_amd64
    macos-arm64: shfmt_v3.10.0_darwin_arm64
args:
  path:
    positional: true
    repeat: true
    type: path
    required: true
  write:
    flag: -w
    type: flag
  simplify:
    flag: -s
    type: flag
  diff:
    flag: -d
    type: flag
output:
  format: text
  success_codes: [0]
parser: text
