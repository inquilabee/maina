name: yamlfmt
cli: yamlfmt
version: 0.21.0
# ShipGate's release template is Linux-only (`yamlfmt_{version}_Linux_{arch}.tar.gz`).
platforms: [linux]
install:
  backend: github
  repo: google/yamlfmt
  tag: v0.21.0
  binary: yamlfmt
  assets:
    linux-x86_64: yamlfmt_0.21.0_Linux_x86_64.tar.gz
    linux-arm64: yamlfmt_0.21.0_Linux_arm64.tar.gz
args:
  path:
    positional: true
    repeat: true
    type: path
    required: true
  config:
    flag: -conf
    type: path
  dry_run:
    flag: -dry
    type: flag
  lint:
    flag: -lint
    type: flag
output:
  format: text
  success_codes: [0]
parser: text
