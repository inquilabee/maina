# Defaults bag auto-prepended onto every other tool via the implicit ``extends``
# chain. Shipped base carries no runtime pins: static binaries (github/path
# backends) need nothing, and the npm backend provisions Node on its own. Pin
# runtimes here only in your own overlay base.yaml, or per tool with
# ``requires: { node: "22" }`` (``requires: null`` on a child clears inherited pins).
abstract: true
