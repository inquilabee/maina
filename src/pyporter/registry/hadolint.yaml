name: hadolint
cli: hadolint
version: 2.12.0
platforms: [linux, macos]
install:
  backend: github
  repo: hadolint/hadolint
  tag: v2.12.0
  binary: hadolint
  assets:
    linux-x86_64: hadolint-Linux-x86_64
    linux-arm64: hadolint-Linux-arm64
    macos-x86_64: hadolint-Darwin-x86_64
    macos-arm64: hadolint-Darwin-arm64
args:
  path:
    positional: true
    repeat: true
    type: path
    required: true
  format:
    flag: -f
    type: string
    default: tty
  failure_threshold:
    flag: --failure-threshold
    type: string
output:
  format: text
  success_codes: [0]
parser: text
